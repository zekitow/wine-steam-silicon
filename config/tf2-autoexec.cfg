// wine-silicon performance preset (safe / no DXVK)
// Graphics tweaks only — avoids the DXVK crash path.

echo "[wine-silicon] loading safe performance autoexec"

fps_max "90"
mat_vsync "0"
mat_queue_mode "2"

mat_antialias "0"
mat_aaquality "0"
mat_motion_blur_enabled "0"
mat_picmip "2"
r_rootlod "2"
r_shadowrendertotexture "0"
mat_hdr_level "0"
mat_colorcorrection "0"
tf_particles_disable_weather "1"

cl_detaildist "0"
cl_detailfade "0"
r_drawdetailprops "0"
cl_ragdoll_forcefade "1"
cl_phys_props_enable "0"
cl_phys_props_max "0"

cl_showfps "1"
echo "[wine-silicon] resolution tip: stay at 1280x720 until stable"
