# DXVK config for TF2 on Apple Silicon (MoltenVK via Wine)
# Docs: https://github.com/doitsujin/dxvk/blob/master/dxvk.conf

# Show FPS while tuning; set to empty / comment out once happy
dxvk.hud = fps,frametimes,gpuload,scale=0.75,opacity=0.6

# Faster shader warmup on drivers that support GPL (helps hitching)
dxvk.enableGraphicsPipelineLibrary = True

# Cap only if you want lower thermals / steadier frame times (0 = uncapped)
# d3d9.maxFrameRate = 120

# Slightly sharper mips; leave 0 if you prefer stock look
# d3d9.samplerLodBias = -1.0
